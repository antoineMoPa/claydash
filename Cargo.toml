[workspace]
members = [
    "crates/sdf_consts"
]

[workspace.dependencies]
bevy_reflect = "0.13"
bevy = "0.13"
serde = "1.0.*"
serde_json = "1.0.*"
bevy_egui = "0.25.0"
uuid = "1.5.0"
bevy_app = "0.13"
sdf_consts = { path = "crates/sdf_consts"}
command_central = { path = "crates/command_central"}
observable_key_value_tree = { path = "crates/observable_key_value_tree" }
lazy_static = "1.4.0"

[package]
name    = "claydash"
version = "0.0.0"
edition = "2021"

[dependencies]
sdf_consts = { workspace = true }
bevy = { workspace = true, features = [ "serialize" ] }
serde = { workspace = true }
serde_json = { workspace = true }
bevy_egui = { workspace = true }
command_central = { workspace = true }
bevy_reflect = { workspace = true }
uuid = { workspace = true }
observable_key_value_tree = { workspace = true }
wasm-bindgen = "0.2.83"
wasm-bindgen-futures = "0.4.33"
futures = "0.3"
js-sys = "0.3.60"
bevy_asset = "0.13"
bevy_pbr = "0.13"
bevy_framepace = "0.15"
bevy_mod_picking = "0.18"
smooth-bevy-cameras = "0.11.0"
epaint = "0.26.2"
rfd = "0.13.0"
futures-lite = "2.0.1"
lazy_static.workspace = true
bevy_math = "0.13.0"

[dependencies.web-sys]
version = "0.3.60"
features = [
  'Headers',
  'Request',
  'RequestInit',
  'RequestMode',
  'Response',
  'ReadableStream',
  'ReadableStreamDefaultReader',
  'Window',
]

[[bin]]
name = "main"
path = "./src/main.rs"

[profile.dev]
opt-level = 3
