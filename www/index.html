<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
      }
      body {
          background: linear-gradient(188deg, #540d8e, #0c0312, #741683);
          background-size: 600% 600%;
      }
      canvas {
          background-color: white;
          width: 100%;
          height: 100%;
          position: absolute;
          top: 0;
          left: 0;
      }
      .loading-message {
          font-size: 3em;
          color: #ffffff;
          font-family: sans-serif;
          text-align: center;
          display: flex;
          align-items: center;
      }
      .loading-spinner {
          width: 1em;
          height: 1em;
          animation: SpinnerRotation 1s linear infinite;
      }
      @keyframes SpinnerRotation {
          to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
          .loading-spinner {
              animation: none;
          }
      }
    </style>
  </head>
  <!-- Fix orbit camera -->
  <body oncontextmenu="return false">
    <p class="loading-message" role="status" aria-label="Loading">
      <img class="loading-spinner" src="./target/loader-circle.svg" alt="" />
    </p>
    <script type="module">
      import init from './target/app.js'
      init().catch(error => {
          console.error(error);
          document.querySelector('.loading-message').innerText = `Failed to start: ${error}`;
      })
    </script>
  </body>
</html>
